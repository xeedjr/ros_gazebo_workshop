#   xhost +local:

services:
  ros2_gazebo:
    build: .
    privileged: true
    runtime: nvidia
    deploy:
      resources:
        # limits:
        #   memory: 4g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: "/root/data/project_ws/build2.sh"
    stdin_open: true
    tty: true
    network_mode: host  
    # ipc: "host"
    # pid: "host"
    #cpuset: "1-5"
    environment:
      - IS_SIM=True
      - DISPLAY
    volumes:
      - ./data:/root/data
      - /dev/input:/dev/input
      - /dev:/dev
      - ros2_data:/root/.ros
      - gazebo_data:/root/.gz
      - gazebo_classic_data:/root/.gazebo

volumes:
  ros2_data:
  gazebo_data:
  gazebo_classic_data:
