Section "Device"
    Identifier "nvidia"
    Driver "nvidia"
    Option "UseDisplayDevice" "none"
    Option "AllowEmptyInitialConfiguration" "True"
EndSection
Section "Monitor"
    Identifier "monitor"
EndSection
Section "Screen"
    Identifier "screen"
    Device "nvidia"
    Monitor "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "layout"
    Screen "screen"
EndSection
