# Sim + x11 (web display) stack — self-contained variant of compose.sim.yaml.
# Bundles the GPU Xorg/noVNC `x11` service and the `ros2_gazebo` sim.
# Uses the same project name, network, and persistent volumes as compose.sim.yaml,
# so it describes the SAME stack: start only one of the two files at a time.
#   xhost +local:

services:
  x11:
    build:
      context: .
      dockerfile: Dockerfile.x11
    privileged: true
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "6080:6080"   # noVNC web (http://localhost:6080/vnc.html)
      - "5900:5900"   # VNC (x11vnc)
    volumes:
      - x11_unix:/tmp/.X11-unix   # X socket, shared with ros2_gazebo (local GLX/DRI3)
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6080' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 20s

  ros2_gazebo:
    build: .
    privileged: true
    runtime: nvidia
    deploy:
      resources:
        # limits:
        #   memory: 4g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      x11:
        condition: service_healthy
    entrypoint: "/root/data/project_ws/build2.sh"
    stdin_open: true
    tty: true
    ports:
      - "8769:8769"   # Foxglove bridge
    # ipc: "host"
    # pid: "host"
    #cpuset: "1-5"
    environment:
      - IS_SIM=True
      # Local X socket (shared x11_unix volume), NOT x11:99 over TCP:
      # the nvidia GLX client cannot create contexts on a remote (TCP)
      # connection (X_GLXCreateNewContext -> BadValue), which crashes
      # gz sim's GUI and breaks RViz2/rtabmap_viz rendering.
      - DISPLAY=:99
    volumes:
      - ./data:/root/data
      - /dev/input:/dev/input
      - /dev:/dev
      - x11_unix:/tmp/.X11-unix
      - ros2_data:/root/.ros
      - gazebo_data:/root/.gz
      - gazebo_classic_data:/root/.gazebo

volumes:
  ros2_data:
  gazebo_data:
  gazebo_classic_data:
  x11_unix:   # X11 socket dir shared by x11 and ros2_gazebo
